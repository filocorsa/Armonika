[workspace]
resolver = "3"
members = ["crates/*", "bench/testdata", "bench/harness"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "AGPL-3.0-only"
repository = "https://github.com/filocorsa/Armonika"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Keep target/ small: line tables are enough for readable backtraces, and
# each test binary would otherwise carry full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
