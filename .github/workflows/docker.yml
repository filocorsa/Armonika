name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only changes that can alter the image rebuild it (tags always build).
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - bench/testdata/**
      - bench/harness/**
      - crates/**
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - bench/testdata/**
      - bench/harness/**
      - crates/**
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/filocorsa/armonika

jobs:
  # Each platform builds natively on its own runner (no QEMU emulation) and pushes
  # its image by digest; `merge` then publishes one multi-platform tag.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Publish the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

  # Every build leaves untagged versions in the package (one image per platform and its
  # provenance attestation, all held together by the tagged index), and every push to
  # main adds a sha-* tag. This keeps main, the images of the last hour and the two
  # newest older ones (to go back to), and deletes the rest with their platform images;
  # untagged versions still used by a kept index are never deleted. On a pull request it
  # only lists what it would delete.
  cleanup:
    needs: [build, merge]
    if: >-
      always() && (
        (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.merge.result == 'success') ||
        (github.event_name == 'pull_request' && needs.build.result == 'success' &&
          github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: armonika
          # Images younger than this are left alone, so a build still running for
          # another ref (a v* tag) does not lose the platform images it just pushed.
          older-than: 1 hour
          keep-n-tagged: 2
          exclude-tags: main,latest,v*
          delete-untagged: true
          delete-partial-images: true
          validate: true
          dry-run: ${{ github.event_name == 'pull_request' }}
