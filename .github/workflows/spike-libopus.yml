# TEMPORARY: spike 6 cross-platform build check for the libopus variant.
# Remove after recording the result in docs/spikes/06-decode-fingerprint.md.
name: spike-libopus

on:
  workflow_dispatch:
  push:
    branches: [phase-0]
    paths:
      - "spikes/06-decode-fingerprint/**"
      - ".github/workflows/spike-libopus.yml"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: spikes/06-decode-fingerprint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tool versions
        run: |
          rustc --version
          cargo --version
          cmake --version || echo "cmake not found"
      - name: Build with libopus (bundled)
        run: |
          start=$(date +%s)
          cargo build --release --locked
          end=$(date +%s)
          echo "BUILD_SECONDS=$((end - start))"
      - name: Build without libopus (pure Rust only)
        run: |
          cargo clean
          start=$(date +%s)
          cargo build --release --locked --no-default-features
          end=$(date +%s)
          echo "BUILD_SECONDS_PURE=$((end - start))"
      - name: Check libopus symbols are linked
        run: cargo tree --locked -e normal -i opusic-sys
