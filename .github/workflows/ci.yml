name: CI

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the Rust jobs are needed. Changes limited to documentation
  # and images (*.md, docs/, images/) cannot affect the build or the tests, so
  # those jobs are skipped (reported as "skipped", which counts as passing).
  # Any other file, or an unknown base (new branch, manual run), runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Detect code changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit: running all jobs"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "changed: $f"
            case "$f" in
              *.md|docs/*|images/*) ;;
              *) code=true ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  test-cross:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bench-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run

  text-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 scripts/check_text_style.py
