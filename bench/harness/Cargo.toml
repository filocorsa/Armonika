[package]
name = "armonika-bench"
description = "Measures the section 3 performance thresholds against a running armonika server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.37"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", features = ["json"] }
