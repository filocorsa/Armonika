[package]
name = "armonika-testdata"
description = "Deterministic fake music library generator for benchmarks and tests"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
lofty = "0.25.5"
rand = "0.10.3"
rand_chacha = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
