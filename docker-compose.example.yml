# Copy this file to docker-compose.yml, then edit the marked lines.
#
# The container runs as uid 1000 and only reads the music. If the music files
# or the ./data folder are owned by another user, set `user:` to that uid and
# gid (for example "1001:1001"), or change the owner of ./data to 1000.
services:
  armonika:
    image: ghcr.io/filocorsa/armonika:main
    # user: "1001:1001"
    ports:
      - "4747:4747"
    environment:
      ARMONIKA_ADMIN_USER: admin
      # Change this. It creates the first admin only when no admin exists.
      ARMONIKA_ADMIN_PASSWORD: change-me
      ARMONIKA_CONFIG: /config/armonika.toml
    volumes:
      - ./data:/data
      - ./armonika.toml:/config/armonika.toml:ro
      # Change the left side to your music folder. Read-only: Armonika never
      # writes to a library.
      - /path/to/your/music:/music:ro
    restart: unless-stopped

# armonika.toml, next to this file:
#
#   [[library]]
#   name = "Music"
#   path = "/music"
