[package]
name = "armonika-server"
description = "The armonika server binary"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "armonika"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
armonika-core = { path = "../armonika-core" }
armonika-scanner = { path = "../armonika-scanner" }
armonika-scrobble = { path = "../armonika-scrobble" }
armonika-search = { path = "../armonika-search" }
armonika-subsonic = { path = "../armonika-subsonic" }
axum = "0.8.9"
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
rpassword = "7.5.5"
rusqlite = "0.41.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
armonika-testdata = { path = "../../bench/testdata" }
assert_cmd = "2"
serde_json = "1.0.154"
figment = { version = "0.10.19", features = ["test"] }
tempfile = "3.27.0"
ureq = "3.5.2"

[lints]
workspace = true
