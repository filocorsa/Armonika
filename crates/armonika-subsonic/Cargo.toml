[package]
name = "armonika-subsonic"
description = "OpenSubsonic API of the Armonika music server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
armonika-core = { path = "../armonika-core" }
armonika-scanner = { path = "../armonika-scanner" }
armonika-search = { path = "../armonika-search" }
axum = "0.8.9"
form_urlencoded = "1.2.2"
md-5 = "0.11.0"
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt", "time"] }
tracing = "0.1.44"

[dev-dependencies]
armonika-testdata = { path = "../../bench/testdata" }
roxmltree = "0.21.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
