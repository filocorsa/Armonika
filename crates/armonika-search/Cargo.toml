[package]
name = "armonika-search"
description = "Search index of the Armonika music server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
armonika-core = { path = "../armonika-core" }
tantivy = "0.27.0"
tokio = { version = "1.54.1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1.44"
unicode-normalization = "0.1.26"

[dev-dependencies]
rusqlite = "0.41.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
