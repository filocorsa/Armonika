[package]
name = "armonika-core"
description = "Core library of the Armonika music server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
dunce = "1.0.5"
getrandom = "0.4.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.36.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
