[package]
name = "armonika-scrobble"
description = "Scrobbling of the Armonika music server: ListenBrainz and a persistent outbox"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
armonika-core = { path = "../armonika-core" }
rusqlite = "0.41.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync"] }
tracing = "0.1.44"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
